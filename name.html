  <main>
    <section class="card">
      <label for="fullname">姓名（繁體中文）</label>
      <div class="name-row">
        <input id="fullname" type="text" maxlength="6" placeholder="例如：陳怡君" autocomplete="name">
        <button class="primary" type="button" id="go">分析</button>
      </div>
      <p class="hint">會自動辨認常見的複姓（歐陽、司馬、張簡、范姜……）。如果姓名是單姓但第二個字也像姓，請在姓和名之間加一個空格，例如「張 簡明」。</p>
      <div id="compare"></div>
    </section>
    <section id="result" hidden></section>
  </main>

  <footer>筆劃依康熙字典部首原形計算，由 Unicode Unihan 資料庫產生；五格與八十一數理採熊崎氏五格剖象法的通行說法。姓名學屬於民間方法，沒有經典依據，僅供參考。</footer>
