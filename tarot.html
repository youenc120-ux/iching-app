    <span class="seal page-seal" aria-hidden="true">牌</span>
    <div><h1>塔羅占卜</h1><p class="subtitle">把心裡的問題說出來</p></div>
  </header>

  <main>
    <!-- 今日塔羅 -->
    <section class="card daily-tarot" id="daily">
      <div class="daily-head">
        <h2>今日塔羅</h2>
        <div class="daily-tabs" role="tablist">
          <button class="active" data-day="0" type="button">今天</button>
          <button data-day="1" type="button">明天</button>
        </div>
      </div>
      <div id="daily-body"></div>
    </section>

    <!-- 對話式占卜 -->
    <section class="card chat" id="chat">
      <div class="chat-head">
        <h2>問牌</h2>
        <div class="chat-tools">
          <button class="link" id="btn-new" type="button">新的問題</button>
          <button class="link" id="btn-settings" type="button">設定</button>
        </div>
      </div>
      <div class="chat-settings" id="settings" hidden>
        <label class="check"><input type="checkbox" id="allow-reversed" checked> 使用逆位（牌倒過來時意思會轉弱或反過來）</label>
        <p class="hint">牌組</p>
        <div class="choices" id="decks"></div>
        <p class="hint">牌背</p>
        <div class="choices" id="backs"></div>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="ask-input" type="text" maxlength="60" placeholder="輸入你想問的事……" enterkeyhint="send">
        <button class="primary" type="submit" aria-label="送出">問</button>
      </form>
    </section>

    <!-- 紀錄（月曆） -->
    <section class="card" id="history-card">
      <div class="history-head">
        <h2>塔羅日記</h2>
        <div class="history-tools">
          <button class="link" id="cal-prev" type="button" aria-label="上個月">‹</button>
          <span id="cal-title"></span>
          <button class="link" id="cal-next" type="button" aria-label="下個月">›</button>
        </div>
      </div>
      <div class="calendar" id="calendar"></div>
      <ul id="history"></ul>
      <p class="hint">紀錄只存在這台裝置的瀏覽器裡。<button class="link" id="btn-clear" type="button">清除全部紀錄</button></p>
    </section>
  </main>

  <dialog class="card-dialog" id="card-dialog">
    <form method="dialog"><button class="link dialog-close" aria-label="關閉"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></form>
